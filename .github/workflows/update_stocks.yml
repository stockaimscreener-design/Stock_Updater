name: Update Stock Data

on:
  schedule:
    # Run every Sunday at 2 AM UTC (adjust timezone as needed)
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install pandas supabase-py
      
      - name: Run stock updater
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python stock_updater.py
      
      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-backup-${{ github.run_number }}
          path: stocks_backup_*.csv
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "Stock update failed! Check the logs."
          # Add email/Slack notification here if needed
