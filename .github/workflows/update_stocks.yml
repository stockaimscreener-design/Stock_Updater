name: Update Stock Data

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
  
jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: List files (debug)
        run: |
          echo "Current directory:"
          pwd
          echo "Files in root:"
          ls -la
          echo "Checking for requirements.txt:"
          test -f requirements.txt && echo "requirements.txt found" || echo "requirements.txt NOT FOUND"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas supabase python-dotenv
      
      - name: Run stock updater
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python stock_updater.py
      
      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-backup-${{ github.run_number }}
          path: stocks_backup_*.csv
          retention-days: 30
