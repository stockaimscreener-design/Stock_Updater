name: Update Stock Data

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Debug file structure
        run: |
          echo "Current working directory:"
          pwd
          echo ""
          echo "Files in root directory:"
          ls -la
          echo ""
          echo "Checking for requirements.txt:"
          if [ -f requirements.txt ]; then
            echo "✅ requirements.txt found"
            cat requirements.txt
          else
            echo "❌ requirements.txt NOT FOUND"
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas supabase python-dotenv
      
      - name: Verify environment
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Pip version:"
          pip --version
          echo ""
          echo "Installed packages:"
          pip list
      
      - name: Run stock updater
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Starting stock updater..."
          python stock_updater.py
      
      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-backup-${{ github.run_number }}
          path: stocks_backup_*.csv
          retention-days: 30
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Stock update completed successfully!"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Stock update failed! Check the logs above for details."
